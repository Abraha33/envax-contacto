name: Foundation CI

on:
  push:
    branches:
      - build/foundation-v1
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify protected legacy files remain present
        run: |
          test -f index.html
          test -f demo.html
          test -d qr-worker

      - name: Verify Supabase foundation files
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql
          test -f supabase/functions/api-v1/index.ts
